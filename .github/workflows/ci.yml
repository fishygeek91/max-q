name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest and ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check maxq tests scripts
      - name: Run tests
        run: pytest
